<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>DON VERE BARBEARIA</title>
    <meta name="description" content="VOCÊ MERECE O MELHOR!">
    <meta name="author" content="Dom Vere" />
    <meta name="theme-color" content="#ffffff" />
    <!-- iOS PWA meta tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DomVere" />
    <script>
      (function() {
        var isPlatform = window.location.hostname === 'painel.zlabs.com.br';
        if(window.location.hostname==='barbearias.zlabs.com.br'||window.location.pathname==='/acesso-barbearias'){document.title='Zlabs Barbearias | Seu atendimento conectado';document.querySelector('meta[name="description"]').content='Agenda, clientes e atendimento conectados. Acesse o ambiente exclusivo da sua barbearia.';document.querySelector('meta[name="apple-mobile-web-app-title"]').content='Zlabs Barbearias';return;}
        var tenantMatch=window.location.pathname.match(/^\/t\/([a-z0-9-]+)(?:\/|$)/);
        if(tenantMatch){
          document.title='Carregando barbearia…';
          document.querySelector('meta[name="apple-mobile-web-app-title"]').content='Barbearia';
          return; // Do not expose Dom Vere installation metadata before tenant identity loads.
        }
        if (isPlatform) {
          document.title = 'Zlabs | Gestão';
          document.querySelector('meta[name="description"]').content = 'Gestão Zlabs de barbearias, sistemas, sites e contratos.';
          document.querySelector('meta[name="author"]').content = 'Zlabs';
          document.querySelector('meta[name="apple-mobile-web-app-title"]').content = 'Zlabs';
        }
        var isBarber = false;
        // Domain-based PWA mode:
        //   cliente.zlabs.com.br  → Client PWA
        //   agendar.zlabs.com.br  → Client PWA (booking)
        //   barber.zlabs.com.br   → Barber/Profissional PWA
        //   domvere.zlabs.com.br  → Admin/Sistema
        if (window.location.hostname.includes('barber') || window.location.hostname.includes('painel')) {
          isBarber = true;
        } else if (window.location.hostname.includes('cliente') || window.location.hostname.startsWith('client.') || window.location.hostname.includes('agendar')) {
          isBarber = false;
        } else {
          // Fallback para localhost/desenvolvimento
          isBarber = !window.location.pathname.startsWith('/cliente') && !window.location.pathname.startsWith('/booking');
        }
        var isClient = !isBarber;

        var manifestHref = isPlatform ? '/manifest-zlabs.webmanifest' : isClient ? '/manifest-client.webmanifest' : '/manifest-barber.webmanifest';
        var iconHref = isPlatform ? '/zlabs-icon-192.png' : isClient ? '/client-icon-blue-192.png?v=4' : '/barber-icon-clean-192.png?v=5';
        var faviconHref = isPlatform ? '/zlabs-icon-192.png' : isClient ? '/client-favicon-blue.png?v=4' : '/barber-favicon.png?v=4';
        var themeColor = isPlatform ? '#2563eb' : isClient ? '#10162e' : '#ffffff';

        // Set manifest
        var linkManifest = document.createElement('link');
        linkManifest.rel = 'manifest';
        linkManifest.href = manifestHref;
        document.head.appendChild(linkManifest);

        // Set apple-touch-icon
        var linkApple = document.createElement('link');
        linkApple.rel = 'apple-touch-icon';
        linkApple.href = iconHref;
        document.head.appendChild(linkApple);

        // Set shortcut icon/favicon
        var linkFavicon = document.createElement('link');
        linkFavicon.rel = 'icon';
        linkFavicon.type = 'image/png';
        linkFavicon.href = faviconHref;
        document.head.appendChild(linkFavicon);

        // Set meta theme-color
        var metaTheme = document.querySelector('meta[name="theme-color"]');
        if (metaTheme) {
          metaTheme.setAttribute('content', themeColor);
        }
      })();
    </script>


    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://domvere.zlabs.com.br/icon-512.png?v=3">

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@DomVere" />
    <meta name="twitter:image" content="https://domvere.zlabs.com.br/icon-512.png?v=3">
    <script>
      (function() {
        function recover() {
          var tried = sessionStorage.getItem('pwa_white_screen_fix');
          if (!tried) {
            sessionStorage.setItem('pwa_white_screen_fix', '1');
            if ('caches' in window) {
              caches.keys().then(function(keys) {
                return Promise.all(keys.map(function(k) { return caches.delete(k); }));
              }).then(function() {
                if ('serviceWorker' in navigator) {
                  return navigator.serviceWorker.getRegistrations().then(function(regs) {
                    return Promise.all(regs.map(function(r) { return r.unregister(); }));
                  });
                }
              }).finally(function() {
                window.location.reload();
              });
            } else {
              window.location.reload();
            }
          }
        }
        window.addEventListener('error', function(e) {
          var root = document.getElementById('root');
          if (root && (!root.firstElementChild || root.innerHTML.trim() === '')) {
            recover();
          }
        });
        setTimeout(function() {
          var root = document.getElementById('root');
          if (root && (!root.firstElementChild || root.innerHTML.trim() === '')) {
            recover();
          }
        }, 2500);
      })();
    </script>
    
  
  
  
  <meta name="build-version" content="%VITE_APP_VERSION%">
  <meta property="og:title" content="DON VERE BARBEARIA">
  <meta name="twitter:title" content="DON VERE BARBEARIA">
  <meta property="og:description" content="VOCÊ MERECE O MELHOR!">
  <meta name="twitter:description" content="VOCÊ MERECE O MELHOR!">
</head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
