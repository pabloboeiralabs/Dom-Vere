<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Push Test</title>
<style>
body{font-family:system-ui;max-width:500px;margin:20px auto;padding:16px;background:#111;color:#fff}
button{width:100%;padding:14px;margin:8px 0;border:none;border-radius:12px;font-size:16px;cursor:pointer}
.green{background:#16a34a;color:#fff}.red{background:#dc2626;color:#fff}.gray{background:#374151;color:#fff}
.log{background:#1f2937;padding:12px;border-radius:8px;margin:8px 0;font-size:13px;word-break:break-all;max-height:300px;overflow-y:auto}
</style></head>
<body>
<h2>🔧 Push Diagnostic</h2>
<div id="log" class="log">Ready...</div>
<button class="gray" onclick="testSW()">1. Check Service Worker</button>
<button class="gray" onclick="testPermission()">2. Check Permission</button>
<button class="gray" onclick="testSubscribe()">3. Test Subscribe (WITH key)</button>
<button class="gray" onclick="testSubscribeNoKey()">4. Test Subscribe (NO key)</button>
<button class="red" onclick="clearAll()">5. Clear Everything & Retry</button>
<script>
const KEY="BN1iq_xw_QmolqgHgdP2_s1eE_gKEAYx5VPF2hG8PiISSSyA8pEZLvG1aayzphjffk8dbyW9H17XhVWb8Uyebzs";
function urlB64ToUint8(b){const p="=".repeat((4-b.length%4)%4);const r=atob((b+p).replace(/-/g,"+").replace(/_/g,"/"));return new Uint8Array([...r].map(c=>c.charCodeAt(0)))}
function log(msg){const d=document.getElementById("log");d.innerHTML+=`\n${new Date().toLocaleTimeString()}: ${msg}`;d.scrollTop=d.scrollHeight}
async function testSW(){try{const r=await navigator.serviceWorker.ready;log(`✅ SW ready: ${r.scope} (${r.active?.state})`)}catch(e){log(`❌ ${e.message}`)}}
async function testPermission(){log(`Notification.permission = "${Notification.permission}"; PushManager = ${!!window.PushManager}`)}
async function testSubscribe(){try{const r=await navigator.serviceWorker.ready;const s=await r.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlB64ToUint8(KEY)});log(`✅ SUBSCRIBED! endpoint: ${s.endpoint.slice(0,60)}...`)}catch(e){log(`❌ ${e.name}: ${e.message}`)}}
async function testSubscribeNoKey(){try{const r=await navigator.serviceWorker.ready;const s=await r.pushManager.subscribe({userVisibleOnly:true});log(`✅ SUBSCRIBED (no key)! endpoint: ${s.endpoint.slice(0,60)}...`)}catch(e){log(`❌ ${e.name}: ${e.message}`)}}
async function clearAll(){try{const regs=await navigator.serviceWorker.getRegistrations();for(const r of regs){const s=await r.pushManager.getSubscription();if(s){await s.unsubscribe();log('Unsubscribed')}await r.unregister();log('SW unregistered')}log('✅ All cleared. Reload page and try step 3')}catch(e){log(`❌ ${e.message}`)}}
</script>
</body>
</html>
