version: '3.8'

services:
  web:
    build:
      context: .
      args:
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        - VITE_SUPABASE_PUBLISHABLE_KEY=${VITE_SUPABASE_PUBLISHABLE_KEY}
        - VITE_VAPID_PUBLIC_KEY=${VITE_VAPID_PUBLIC_KEY}
        - VITE_APP_VERSION=${VITE_APP_VERSION}
    container_name: domvere-frontend-app
    restart: always
    expose:
      - "80"
    environment:
      - VIRTUAL_HOST=domvere.zlabs.com.br
      - VIRTUAL_PORT=80
      - LETSENCRYPT_HOST=domvere.zlabs.com.br
      - LETSENCRYPT_EMAIL=painel@zlabs.com.br
    networks:
      - domvere-network
      - zlabs-nginx-proxy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  domvere-network:
    name: domvere-network
    driver: bridge
  zlabs-nginx-proxy:
    external: true