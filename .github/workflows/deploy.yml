name: Deploy para VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Dom Vere
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script_stop: true
          script: |
            set -e
            echo "=== Iniciando deploy ==="
            cd /root/domvere-frontend

            echo "=== Atualizando código ==="
            git fetch origin main
            git reset --hard origin/main

            echo "=== Buildando nova imagem (sem derrubar o atual) ==="
            docker compose build web

            echo "=== Trocando container (downtime mínimo) ==="
            docker compose up -d --no-build --force-recreate

            echo "=== Deploy concluído! ==="
            docker ps --filter "name=domvere-frontend-app" --format "table {{.Names}}\t{{.Status}}"

