server {
    listen 80;
    server_name agendar.zlabs.com.br;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name agendar.zlabs.com.br;
    ssl_certificate /etc/nginx/ssl/agendar/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/agendar/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    client_max_body_size 100M;
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webmanifest|json|woff2?)$ {
        proxy_pass http://domvere-frontend-app:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /sw.js {
        proxy_pass http://domvere-frontend-app:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Cloudflare-CDN-Cache-Control "no-cache";
    }
    location / {
        proxy_pass http://domvere-frontend-app:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Cloudflare-CDN-Cache-Control "no-cache";
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
